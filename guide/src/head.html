<title>עור, לא איפור</title>
<style>
/*FONTS*/

/* ============ tokens ============ */
:root{
  --ground:#F1EEF2; --surface:#FBFAFC; --surface-2:#E8E3EC; --sunk:#E4DEE9;
  --ink:#221A26; --ink-soft:#5C5264; --ink-faint:#8A7F92;
  --rule:#DCD4E1; --rule-strong:#C6BBCE;
  --accent:#8E3B5B; --accent-ink:#6E2843; --accent-soft:#F5E4EB; --accent-line:#D9A9BE;
  --cognac:#9A6533; --cognac-soft:#F4E9DA; --cognac-line:#D9B183;
  --sage:#5F6E57; --sage-soft:#E6EBE2; --sage-line:#A9B89F;
  --shadow:0 1px 2px rgba(34,26,38,.05), 0 8px 24px -12px rgba(34,26,38,.14);
  --serif:'Frank Ruhl Libre', 'Times New Roman', serif;
  --sans:'Assistant', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  /* face-map zone hues — mid-tone so they read on both grounds */
  --z-red:#2E8C68; --z-pore:#4E79AC; --z-bronze:#A96A2C;
  --z-blush:#C4557C; --z-glow:#C89322; --z-conceal:#7A68BC; --z-powder:#7E8794;
  /* the chart itself is "paper" in both themes so zone colour reads identically */
  --skin:#F4E7DC; --skin-line:#5A4740; --skin-edge:#B99C89; --hair:#937052;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141019; --surface:#1D1724; --surface-2:#282031; --sunk:#100C15;
    --ink:#F0EAF3; --ink-soft:#AFA4B8; --ink-faint:#81768A;
    --rule:#332A3C; --rule-strong:#4A3E55;
    --accent:#E495B3; --accent-ink:#F2BDD1; --accent-soft:#33202B; --accent-line:#7A4459;
    --cognac:#DCA66F; --cognac-soft:#33261A; --cognac-line:#7C5A34;
    --sage:#A6B79B; --sage-soft:#222A1F; --sage-line:#5A6852;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#141019; --surface:#1D1724; --surface-2:#282031; --sunk:#100C15;
  --ink:#F0EAF3; --ink-soft:#AFA4B8; --ink-faint:#81768A;
  --rule:#332A3C; --rule-strong:#4A3E55;
  --accent:#E495B3; --accent-ink:#F2BDD1; --accent-soft:#33202B; --accent-line:#7A4459;
  --cognac:#DCA66F; --cognac-soft:#33261A; --cognac-line:#7C5A34;
  --sage:#A6B79B; --sage-soft:#222A1F; --sage-line:#5A6852;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

/* ============ base ============ */
*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-weight:400; font-size:17px; line-height:1.72;
  direction:rtl; text-align:right;
  font-feature-settings:"kern" 1; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-family:var(--serif); font-weight:700; line-height:1.2; text-wrap:balance; margin:0 }
p{margin:0}
a{color:var(--accent); text-decoration-thickness:1px; text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent); outline-offset:3px; border-radius:3px
}
::selection{background:var(--accent-soft); color:var(--accent-ink)}

/* ============ shell ============ */
.shell{ max-width:1240px; margin-inline:auto; padding:0 clamp(18px,4vw,44px) 120px;
  display:grid; grid-template-columns:212px minmax(0,1fr); gap:clamp(28px,4vw,64px); align-items:start }
@media (max-width:940px){ .shell{ grid-template-columns:minmax(0,1fr) } }
main{ min-width:0; display:flex; flex-direction:column; gap:clamp(56px,7vw,96px) }

/* ============ index rail ============ */
.rail{ position:sticky; top:26px; padding-top:26px; display:flex; flex-direction:column; gap:14px }
@media (max-width:940px){ .rail{ position:static; padding-top:0; margin-bottom:8px } }
.rail-title{ font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.16em;
  color:var(--ink-faint); padding-bottom:10px; border-bottom:1px solid var(--rule) }
.rail nav{ display:flex; flex-direction:column; gap:1px }
@media (max-width:940px){ .rail nav{ flex-flow:row wrap; gap:6px } }
.rail a{ display:flex; align-items:baseline; gap:9px; padding:6px 9px; margin-inline-start:-9px;
  border-radius:6px; color:var(--ink-soft); font-size:14.5px; text-decoration:none; transition:background .15s, color .15s }
.rail a:hover{ background:var(--surface-2); color:var(--ink) }
.rail a .n{ font-size:11px; font-weight:700; color:var(--ink-faint); font-variant-numeric:tabular-nums; min-width:1.1em }
@media (max-width:940px){ .rail a{ background:var(--surface); border:1px solid var(--rule); margin:0 } }

/* ============ hero ============ */
.hero{ padding:clamp(52px,9vw,104px) 0 0; border-bottom:1px solid var(--rule); padding-bottom:clamp(38px,5vw,58px) }
.eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.19em; color:var(--accent);
  display:flex; align-items:center; gap:11px; margin-bottom:22px }
.eyebrow::after{ content:""; flex:1; height:1px; background:var(--accent-line); opacity:.55 }
.hero h1{ font-size:clamp(52px,11vw,104px); font-weight:900; letter-spacing:-.022em; line-height:.98; margin-bottom:6px }
.hero h1 em{ font-style:normal; color:var(--accent); }
.hero .deck{ font-family:var(--serif); font-size:clamp(20px,2.7vw,27px); line-height:1.45;
  color:var(--ink-soft); max-width:40ch; margin-top:26px; font-weight:400 }
.hero .deck b{ color:var(--ink); font-weight:500 }
.hero-meta{ display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:34px;
  font-size:13px; color:var(--ink-faint); letter-spacing:.03em }
.hero-meta span{ display:flex; align-items:center; gap:7px }
.hero-meta span::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--accent-line) }

/* ============ section frame ============ */
section{ scroll-margin-top:24px }
.sec-head{ display:flex; align-items:flex-start; gap:16px; margin-bottom:clamp(22px,3vw,34px);
  padding-bottom:16px; border-bottom:1px solid var(--rule) }
.sec-num{ font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--accent);
  padding-top:.85em; font-variant-numeric:tabular-nums; flex:none }
.sec-head h2{ font-size:clamp(29px,4.6vw,42px); letter-spacing:-.015em; flex:1 }
.sec-head .sub{ font-size:14px; color:var(--ink-faint); margin-top:7px; font-family:var(--sans); font-weight:400; line-height:1.55 }
.lede{ font-family:var(--serif); font-size:clamp(18px,2.2vw,21px); line-height:1.6; color:var(--ink-soft); max-width:60ch; margin-bottom:30px }
.prose{ max-width:66ch; display:flex; flex-direction:column; gap:17px }
.prose b,.prose strong{ font-weight:700; color:var(--ink) }

/* ============ cards ============ */
.card{ background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:22px 24px; box-shadow:var(--shadow) }
.grid{ display:grid; gap:16px }
.g2{ grid-template-columns:repeat(auto-fit,minmax(292px,1fr)) }
.g3{ grid-template-columns:repeat(auto-fit,minmax(232px,1fr)) }

/* finding cards */
.finding{ background:var(--surface); border:1px solid var(--rule); border-radius:12px; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:var(--shadow) }
.finding > .top{ padding:19px 22px 16px; border-bottom:1px dashed var(--rule) }
.finding h3{ font-size:20px; letter-spacing:-.01em; margin-bottom:7px }
.finding .obs{ font-size:14.5px; color:var(--ink-soft); line-height:1.6 }
.finding .fix{ padding:15px 22px 19px; background:var(--surface-2); font-size:14.5px; line-height:1.62; flex:1 }
.finding .fix b{ color:var(--accent-ink); font-weight:700 }
:root[data-theme="dark"] .finding .fix b{ color:var(--accent-ink) }
.tagrow{ display:flex; flex-wrap:wrap; gap:6px; margin-top:11px }
.tag{ font-size:11px; font-weight:700; letter-spacing:.05em; padding:3px 9px; border-radius:99px;
  border:1px solid var(--rule-strong); color:var(--ink-faint); background:var(--ground) }
.tag.a{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft) }
.tag.c{ color:var(--cognac); border-color:var(--cognac-line); background:var(--cognac-soft) }
.tag.s{ color:var(--sage); border-color:var(--sage-line); background:var(--sage-soft) }

/* ============ steps ============ */
.steps{ display:flex; flex-direction:column; gap:0; counter-reset:s }
.step{ display:grid; grid-template-columns:auto minmax(0,1fr) 196px;
  grid-template-rows:auto 1fr; gap:0 20px; position:relative; padding-bottom:34px }
.step > .dot{ grid-column:1; grid-row:1 / span 2 }
.step > div:not(.body):not(.dot){ grid-column:2; grid-row:1 }
.step > .body{ grid-column:2; grid-row:2 }
.step > .figwrap{ grid-column:3; grid-row:1 / span 2; margin:0; align-self:start;
  background:var(--surface); border:1px solid var(--rule); border-radius:11px; padding:8px 6px 4px }
.figwrap svg.fig{ width:100%; height:auto; display:block }
.figwrap figcaption{ font-size:12.5px; font-weight:700; line-height:1.4; text-align:center;
  color:var(--ink-soft); padding:6px 6px 4px; border-top:1px dashed var(--rule); margin-top:4px }
@media (max-width:780px){
  .step{ grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto auto auto }
  .step > .dot{ grid-row:1 / span 3 }
  .step > .figwrap{ grid-column:2; grid-row:3; max-width:252px; margin:16px 0 2px }
}
.step:last-child{ padding-bottom:0 }
.step::before{ content:""; position:absolute; top:38px; bottom:2px; inset-inline-start:18px; width:1px; background:var(--rule) }
.step:last-child::before{ display:none }
.step .dot{ grid-row:1/3; width:38px; height:38px; border-radius:50%; background:var(--surface);
  border:1px solid var(--rule-strong); display:grid; place-items:center; position:relative; z-index:1;
  font-family:var(--sans); font-weight:700; font-size:14px; color:var(--accent); font-variant-numeric:tabular-nums }
.step h3{ font-size:20.5px; margin-bottom:3px; padding-top:5px; letter-spacing:-.008em }
.step .when{ font-size:12px; font-weight:700; letter-spacing:.09em; color:var(--ink-faint); margin-bottom:11px }
.step .body{ font-size:15.5px; line-height:1.68; color:var(--ink-soft); display:flex; flex-direction:column; gap:11px }
.step .body b{ color:var(--ink); font-weight:700 }
.callout{ border-inline-start:2px solid var(--accent-line); background:var(--accent-soft);
  padding:11px 15px; border-radius:0 8px 8px 0; font-size:14px; line-height:1.6; color:var(--ink) }
.callout.warn{ border-color:var(--cognac-line); background:var(--cognac-soft) }
.callout .lbl{ font-weight:700; color:var(--accent-ink); letter-spacing:.02em }
.callout.warn .lbl{ color:var(--cognac) }
:root[data-theme="dark"] .callout .lbl{ color:var(--accent) }

/* ============ face map ============ */
.mapwrap{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:clamp(16px,3vw,30px);
  display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:clamp(18px,3vw,34px); align-items:center; box-shadow:var(--shadow) }
@media (max-width:820px){ .mapwrap{ grid-template-columns:minmax(0,1fr) } }
.mapwrap svg{ width:100%; height:auto; display:block; max-height:640px }
.legend{ display:flex; flex-direction:column; gap:3px }
.legend button{ display:flex; align-items:flex-start; gap:10px; text-align:right; background:none; border:0;
  padding:9px 10px; border-radius:8px; cursor:pointer; font-family:var(--sans); color:var(--ink); width:100%;
  transition:background .15s; border:1px solid transparent }
.legend button:hover,.legend button[aria-pressed="true"]{ background:var(--surface-2); border-color:var(--rule) }
.legend .sw{ width:14px; height:14px; border-radius:4px; flex:none; margin-top:4px; border:1px solid rgba(0,0,0,.14) }
.legend .lx{ display:flex; flex-direction:column; gap:2px; min-width:0 }
.legend .lt{ display:block; font-size:14px; font-weight:700; line-height:1.3 }
.legend .ld{ display:block; font-size:12.5px; color:var(--ink-faint); line-height:1.45 }
.zone{ opacity:.85; transition:opacity .25s ease; cursor:pointer }
.mapwrap.dim .zone{ opacity:.07 }
.mapwrap.dim .zone.on{ opacity:1 }

/* ============ product table ============ */
.tablewrap{ overflow-x:auto; border:1px solid var(--rule); border-radius:12px; background:var(--surface); box-shadow:var(--shadow) }
table{ border-collapse:collapse; width:100%; min-width:660px; font-size:14.5px }
thead th{ background:var(--surface-2); text-align:right; padding:12px 15px; font-size:11.5px; font-weight:700;
  letter-spacing:.11em; color:var(--ink-faint); border-bottom:1px solid var(--rule); white-space:nowrap }
tbody td{ padding:14px 15px; border-bottom:1px solid var(--rule); vertical-align:top; line-height:1.55; color:var(--ink-soft) }
tbody tr:last-child td{ border-bottom:0 }
tbody tr:hover td{ background:var(--surface-2) }
td .pname{ color:var(--ink); font-weight:700; display:block; margin-bottom:2px }
td .brand{ font-size:12.5px; color:var(--ink-faint); letter-spacing:.03em }
td .shade{ display:inline-block; font-weight:700; color:var(--accent-ink); background:var(--accent-soft);
  border:1px solid var(--accent-line); border-radius:5px; padding:1px 7px; font-size:13px; white-space:nowrap }
:root[data-theme="dark"] td .shade{ color:var(--accent-ink) }
td.price, td .price{ font-variant-numeric:tabular-nums; white-space:nowrap; font-size:13.5px }
.num{ white-space:nowrap; unicode-bidi:isolate }
.where{ font-size:11.5px; font-weight:700; letter-spacing:.04em; padding:3px 8px; border-radius:5px;
  border:1px solid var(--rule-strong); background:var(--ground); color:var(--ink-faint); white-space:nowrap; display:inline-block }
.where.sp{ color:#1E6B4E; border-color:#8FC4AC; background:#E4F2EB }
.where.il{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft) }
.where.imp{ color:var(--cognac); border-color:var(--cognac-line); background:var(--cognac-soft) }
:root[data-theme="dark"] .where.sp{ color:#7FD1AC; border-color:#2F6B51; background:#132A20 }
.tier{ font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--ink-faint) }

/* group heading inside tables */
tbody tr.grouprow td{ background:var(--sunk); font-family:var(--serif); font-weight:700; font-size:16px;
  color:var(--ink); padding:11px 15px; letter-spacing:-.005em }
tbody tr.grouprow td small{ font-family:var(--sans); font-weight:400; font-size:12.5px; color:var(--ink-faint); margin-inline-start:10px; letter-spacing:0 }

/* ============ technique blocks ============ */
.tech{ background:var(--surface); border:1px solid var(--rule); border-radius:12px; overflow:hidden; box-shadow:var(--shadow) }
.tech > summary{ padding:17px 22px; cursor:pointer; list-style:none; display:flex; align-items:flex-start; gap:14px }
.tech > summary::-webkit-details-marker{ display:none }
.tech > summary::after{ content:"+"; margin-inline-start:auto; font-size:21px; color:var(--ink-faint); line-height:1; flex:none;
  font-family:var(--sans); transition:transform .2s }
.tech[open] > summary::after{ transform:rotate(45deg) }
.tech > summary:hover{ background:var(--surface-2) }
.tech .th{ flex:1; min-width:0 }
.tech .th h3{ font-size:19.5px; letter-spacing:-.008em }
.tech .th .by{ font-size:12.5px; color:var(--accent); font-weight:700; letter-spacing:.04em; margin-top:4px }
.tech .th .by span{ color:var(--ink-faint); font-weight:400; letter-spacing:0 }
.tech .tbody{ padding:4px 22px 22px; border-top:1px dashed var(--rule); display:flex; flex-direction:column; gap:15px; font-size:15px; line-height:1.68; color:var(--ink-soft) }
.tech .tbody h4{ font-family:var(--sans); font-size:11.5px; font-weight:700; letter-spacing:.13em; color:var(--ink-faint); margin-top:5px }
.tech ol,.tech ul{ margin:0; padding-inline-start:1.25em; display:flex; flex-direction:column; gap:8px }
.tech ol li::marker{ color:var(--accent); font-weight:700 }
.tech b{ color:var(--ink) }

/* ============ videos ============ */
.vid{ display:flex; gap:15px; padding:16px 18px; background:var(--surface); border:1px solid var(--rule);
  border-radius:11px; text-decoration:none; color:inherit; transition:border-color .16s, transform .16s, box-shadow .16s }
.vid:hover{ border-color:var(--accent-line); transform:translateY(-2px); box-shadow:var(--shadow) }
.vid .play{ width:38px; height:38px; border-radius:9px; background:var(--accent-soft); border:1px solid var(--accent-line);
  display:grid; place-items:center; flex:none; color:var(--accent) }
.vid .vt{ font-size:15.5px; font-weight:700; color:var(--ink); line-height:1.35; margin-bottom:3px }
.vid .vc{ font-size:12.5px; color:var(--accent); font-weight:700; letter-spacing:.03em }
.vid .vw{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin-top:6px }

/* ============ mistakes ============ */
.dont{ display:flex; gap:14px; padding:16px 18px; border:1px solid var(--rule); border-radius:11px; background:var(--surface) }
.dont .x{ width:26px; height:26px; border-radius:50%; background:var(--cognac-soft); border:1px solid var(--cognac-line);
  color:var(--cognac); display:grid; place-items:center; font-weight:700; font-size:14px; flex:none; margin-top:2px }
.dont h4{ font-family:var(--serif); font-size:17.5px; margin-bottom:5px; color:var(--ink) }
.dont p{ font-size:14.5px; color:var(--ink-soft); line-height:1.6 }
.dont p b{ color:var(--ink) }
.vs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px }
.vs-cell{ margin:0; border:1px solid var(--rule); border-radius:9px; overflow:hidden; background:var(--ground) }
.vs-cell svg.fig{ width:100%; height:auto; display:block }
.vs-cell figcaption{ font-size:11.5px; font-weight:700; line-height:1.35; padding:6px 8px;
  display:flex; align-items:center; gap:6px; border-top:1px solid var(--rule) }
.vs-cell .mk{ width:15px; height:15px; border-radius:50%; display:grid; place-items:center;
  font-size:10px; flex:none; color:#fff }
.vs-cell.bad{ border-color:var(--cognac-line) }
.vs-cell.bad figcaption{ color:var(--cognac); background:var(--cognac-soft); border-top-color:var(--cognac-line) }
.vs-cell.bad .mk{ background:var(--cognac) }
.vs-cell.good{ border-color:var(--accent-line) }
.vs-cell.good figcaption{ color:var(--accent-ink); background:var(--accent-soft); border-top-color:var(--accent-line) }
.vs-cell.good .mk{ background:var(--accent) }
:root[data-theme="dark"] .vs-cell.bad .mk,
:root[data-theme="dark"] .vs-cell.good .mk{ color:#1a1420 }

/* ============ misc ============ */
.note{ border:1px dashed var(--rule-strong); background:var(--surface); border-radius:11px; padding:17px 20px;
  font-size:14.5px; line-height:1.65; color:var(--ink-soft) }
.note b{ color:var(--ink) }
footer{ margin-top:clamp(56px,8vw,96px); padding-top:26px; border-top:1px solid var(--rule);
  font-size:13.5px; color:var(--ink-faint); line-height:1.7; max-width:70ch }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important } }
</style>
